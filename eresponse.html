<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUQUINN'S BAKES | Response</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--  NAVBAR  -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="ahomepage.html">

                LUQUINN'S BAKES

            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="ahomepage.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="brecipes.html">Recipes</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cguide.html">Guide</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="dcontact.html">Contact</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main>

        <section class="container my-5 text-center">

            <h1>

                Thank You!

            </h1>

            <p>

                Your message has been submitted successfully.

            </p>

        </section>
        <!-- The confirmation message. container centers and width-limits; my-5 large vertical margin; text-center centers the text. <h1> is the page's main heading. This is static text — it always says "Thank You!" regardless of what was submitted. -->

        <section class="container mb-5">

            <h2 class="text-center mb-4">

                Submission Summary

            </h2>
            <!-- Section holding the results table. mb-5 = margin below; the <h2> is centered with mb-4 (margin below the heading). -->

            <div class="table-responsive">
                <!-- table-responsive lets the table scroll sideways on small screens instead of overflowing. -->

                <table class="table table-bordered">
                    <!-- table table-bordered are Bootstrap table styles (borders on every cell). -->

                    <tbody>
                    <!-- The table body. Notice there's no <thead> here — unlike the Baking Essentials table on the guide page. That's deliberate: this table has no column headings across the top. Instead, each row is a label-and-value pair, so the "headers" run down the left side. -->

                        <tr>

                            <th>Name</th>

                            <td id="displayName"></td>

                        </tr>
                        <!-- <th>Name</th> — a header cell used as the row label on the left. <th> isn't only for the top of a table; used at the start of a row it labels that row. -->
                        <!-- <td id="displayName"></td> — a data cell that is empty in the HTML. The id is the hook your JavaScript uses to find this cell and fill it. This is the critical bit: the page ships blank, and script.js writes the submitted value in here. -->

                        <tr>

                            <th>Email</th>

                            <td id="displayEmail"></td>

                        </tr>

                        <tr>

                            <th>Phone Number</th>

                            <td id="displayPhone"></td>

                        </tr>

                        <tr>

                            <th>Topic</th>

                            <td id="displayTopic"></td>

                        </tr>

                        <tr>

                            <th>Message</th>

                            <td id="displayMessage"></td>

                        </tr>
                        <!-- The same pattern repeated for the other four fields. -->
                        <!-- Each has a left-side label (<th>) and an empty <td> with a unique id: displayEmail, displayPhone, displayTopic, displayMessage. -->
                        <!-- These five ids exactly match what script.js looks for — that's how the data lands in the right rows. -->

                    </tbody>

                </table>

            </div>
            <!-- Closes the table body, table, and the responsive wrapper. -->

            <div class="text-center mt-4">

                <a href="ahomepage.html"
                    class="btn btn-dark">

                    Back to Home

                </a>

            </div>
            <!-- A centered link styled as a button (btn btn-dark — Bootstrap button, recolored brown by your CSS). -->
            <!-- mt-4 = margin above it. It's an <a> (link), not a <button> — because it just navigates to another page rather than submitting anything. -->
            <!-- Small Q&A-worthy distinction: use <a> for "go somewhere," <button> for "do something." -->

        </section>

    </main>
    <!-- Closes the section and <main>. -->

    <footer>

        <div class="container text-center">

            <p>

                © 2026 LUQUINN'S BAKES. All rights reserved.

            </p>

        </div>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->

    <script src="js/script.js"></script>

</body>

</html>
