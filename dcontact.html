    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="ahomepage.html">

                LUQUINN'S BAKES

            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="ahomepage.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="brecipes.html">Recipes</a>
                    </li>

                    <li class="nav-item">

                    <li class="nav-item">
                        <a class="nav-link active" href="dcontact.html">Contact</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main>

        <section class="container my-5">

            <div class="text-center">

                <h1>Contact Us</h1>

                <p>

                    We'd love to hear from you.
                    Fill in the form below and we'll get back to you soon.

                </p>

            </div>

        </section>

        <section class="container mb-5">

            <div class="row">

                <!-- IMAGE -->

                <div class="col-lg-5 text-center">

                    <img src="images/contact.jpg"
                        class="img-fluid rounded"
                        alt="Contact">

                </div>

                <!-- FORM -->

                <div class="col-lg-7">

                    <form action="eresponse.html"
      method="get"
      onsubmit="return validateForm()">

                        <div class="mb-3">

                            <label class="form-label">

                                Name

                            </label>

                            <input
    type="text"
    id="name"
    class="form-control"
    name="name">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
    type="email"
    id="email"
    class="form-control"
    name="email">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                name="phone">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Favourite Dessert

                            </label>

                            <select
                                class="form-select"
                                name="dessert">

                                <option>Chocolate Cake</option>
                                <option>Cookies</option>
                                <option>Cheesecake</option>
                                <option>Brownies</option>
                                <option>Banana Bread</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Message

                            </label>

                            <textarea
    id="message"
    class="form-control"
    rows="5"
    name="message"></textarea>

                        </div>

                        <button
                            class="btn btn-dark"
                            type="submit">

                            Submit

                        </button>

                        <p id="response"
   class="mt-3 fw-bold">

</p>

                    </form>

                </div>

            </div>

        </section>

        <section class="container text-center mb-5">

            <h2>

                Contact Information

            </h2>

            <p>

                Email:
                hello@luquinnsbakes.com

            </p>

            <p>

                Phone:
                +65 9123 4567

            </p>

            <p>

                Location:
                Singapore

            </p>

        </section>

    </main>

    <footer>

        <div class="container text-center">

            <p>

                © 2026 LUQUINN'S BAKES. All rights reserved.

            </p>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>

</body>
