<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | LUQUINN'S BAKES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">LUQUINN'S BAKES</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="ahomepage.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="brecipes.html">Recipes</a></li>
          <li class="nav-item"><a class="nav-link" href="cguide.html">Guide</a></li>
          <li class="nav-item"><a class="nav-link" href="dcontact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

<main class="container">
    <h1>Bake With Us</h1>
    <p>Tell us what you like and we'll be in touch about the next session.</p>

    <!-- action sends the data to response.html
         method="get" puts the answers in the URL so JS can read them back -->
    <form action="eresponse.html" method="get">

      <!-- mb-3 is Bootstrap spacing: margin-bottom, size 3 -->
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="mb-3">
        <label for="level" class="form-label">Skill level</label>
        <select class="form-select" id="level" name="level">
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>

      <!-- radios share the same name so only one can be selected -->
      <div class="mb-3">
        <p class="form-label">Which bake do you want to learn</p>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="baketype" id="bake1" value="BAKE1" checked>
          <label class="form-check-label" for="bake1">Chocolate Cake</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="baketype" id="bake2" value="BAKE2">
          <label class="form-check-label" for="bake2">Chocolate Chip Cookies</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="baketype" id="bake3" value="BAKE3">
          <label class="form-check-label" for="bake3">BAKE3</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="baketype" id="bake4" value="BAKE4">
          <label class="form-check-label" for="bake4">BAKE4</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="baketype" id="bake5" value="BAKE5">
          <label class="form-check-label" for="bake5">BAKE5</label>
        </div>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-dark">Submit</button>

    </form>
  </main>

  <footer class="text-center">
    <p>LUQUINN'S BAKES - 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
